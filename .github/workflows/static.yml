name: Deploy Vite Site to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          # Points to where your package.json sits
          cache-dependency-path: './artifacts/syspro-technologies/package.json' 

      - name: Install dependencies
        run: npm ci
        working-directory: './artifacts/syspro-technologies'

      - name: Build site
        env:
          BASE_PATH: './'
        run: npm run build
        working-directory: './artifacts/syspro-technologies'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Vite puts final built files into a 'dist' folder inside your project folder
          path: './artifacts/syspro-technologies/dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
